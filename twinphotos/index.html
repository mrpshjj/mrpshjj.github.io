const EMAIL = "ddgd8389@gmail.com";

function render(code) {
  const t = CONTENT[code] || CONTENT.en;
  document.documentElement.lang = code;
  document.getElementById("tagline").textContent = t.tagline;
  document.getElementById("contactTitle").textContent = t.contact;
  document.getElementById("contactBody").innerHTML =
    t.contactBody + '<br><a href="mailto:' + EMAIL + '">' + EMAIL + "</a><br>" + t.reply;
  document.getElementById("faqTitle").textContent = t.faqTitle;
  document.getElementById("privacyLink").textContent = t.privacy;
  document.getElementById("faq").innerHTML = t.faq.map(function (item) {
    // 질문은 사용자가 쓴 글이 아니라 이 파일 안의 고정 문구라 그대로 넣어도 안전하다.
    return '<div class="card"><h3>' + item.q + "</h3><p>" + item.a + "</p></div>";
  }).join("");
}

// 브라우저 언어에 맞춘다. 정확히 일치하는 것이 없으면 앞 두 글자로 찾고,
// 그것도 없으면 영어로 떨어진다. 지원하지 않는 언어 사용자가 빈 화면을 보면 안 된다.
function pick() {
  const saved = localStorage.getItem("lang");
  if (saved && CONTENT[saved]) return saved;
  for (const raw of navigator.languages || [navigator.language || "en"]) {
    if (CONTENT[raw]) return raw;
    const base = raw.split("-")[0];
    const hit = Object.keys(CONTENT).find(function (k) { return k.split("-")[0] === base; });
    if (hit) return hit;
  }
  return "en";
}

const initial = pick();
document.getElementById("lang").value = initial;
render(initial);

document.getElementById("lang").addEventListener("change", function (e) {
  localStorage.setItem("lang", e.target.value);
  render(e.target.value);
});
</script>
